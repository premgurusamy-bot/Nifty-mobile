# Builds an installable Android APK on GitHub's runners (which ship the
# Android SDK) and publishes it on the repo's Releases page.
# Phone download link (always the newest build):
#   https://github.com/premgurusamy-bot/Nifty-mobile/releases/latest/download/nifty-trader.apk
# Pushing a version tag (v1.0, v2.0, …) builds that exact code as a named, permanent
# release, e.g. https://github.com/premgurusamy-bot/Nifty-mobile/releases/download/v1.0/nifty-trader.apk
name: Android APK

on:
  push:
    branches: [ccr-f60cf00a-vmzuuf, main]
    tags: ['v*']
    paths-ignore: ['**.md', 'server/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle 9 / AGP 9 run on 21; React Native's Kotlin toolchain targets 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Tests and typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # arm64-v8a covers practically every Android phone sold since ~2017.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/nifty-trader.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nifty-trader-apk
          path: out/nifty-trader.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Version tags publish under their own name and never replace "latest" (the newest build).
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'tag' && format('Nifty Trader {0}', github.ref_name) || format('Nifty Trader APK (build {0})', github.run_number) }}
          make_latest: ${{ github.ref_type == 'tag' && 'false' || 'true' }}
          files: out/nifty-trader.apk
          body: |
            Android APK built from ${{ github.sha }}.

            Install: open this page on your phone, tap **nifty-trader.apk**, then allow
            "Install unknown apps" for your browser when Android asks.

            Signed with a debug key (sideload builds). If a later build refuses to
            install over this one, uninstall the old app first.
